<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статус VPN</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #2ed573;
            overflow: hidden;
            position: relative;
        }

        /* Карточка таймера */
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 10;
            border: 4px solid #1f2937;
        }

        h1 { font-size: 24px; margin-bottom: 20px; }
        .timer { font-size: 48px; font-weight: bold; margin: 20px 0; font-variant-numeric: tabular-nums; }
        .status-active { color: #dc2626; }
        .status-inactive { color: #10b981; }
        
        .admin-panel {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #e5e7eb;
            display: none;
            background: #f9fafb;
            border-radius: 8px;
            padding: 15px;
        }
        .admin-panel input {
            padding: 8px;
            margin: 10px 0;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            width: 80%;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }
        .btn-start { background-color: #2563eb; color: white; }
        .share-box { margin-top: 15px; display: none; }
        .share-input { width: 90%; padding: 8px; font-size: 12px; text-align: center; }

        /* Препятствия: Камни */
        .rock {
            position: absolute;
            width: 50px;
            height: 40px;
            background-color: #4b5563;
            border: 4px solid #1f2937;
            border-radius: 8px;
            z-index: 2;
        }

        /* Упрощенный дизайн пиксельного кота */
        .pixel-cat {
            position: absolute;
            width: 40px;
            height: 30px;
            border-radius: 4px;
            z-index: 5;
            will-change: left, top;
            border: 3px solid #1f2937;
        }
        /* Хвостик и ушки кота рисуем через псевдоэлементы */
        .pixel-cat::before {
            content: "▲ ▲";
            position: absolute;
            top: -14px; left: 4px;
            font-size: 12px;
            letter-spacing: 6px;
        }
    </style>
</head>
<body>

<!-- Препятствия-камни -->
<div class="rock" style="top: 15%; left: 15%;"></div>
<div class="rock" style="top: 20%; right: 15%;"></div>
<div class="rock" style="bottom: 20%; left: 10%;"></div>
<div class="rock" style="bottom: 15%; right: 20%;"></div>

<div class="container" id="main-card">
    <h1 id="status-title">Определение статуса...</h1>
    <div id="countdown" class="timer">00:00:00</div>

    <!-- АДМИН-ПАНЕЛЬ -->
    <div id="admin-block" class="admin-panel">
        <h3>Панель администратора</h3>
        <label>Укажите дату и время отключения:<br>
            <input type="datetime-local" id="target-time">
        </label><br>
        <button class="btn btn-start" id="btn-generate">Сгенерировать ссылку</button>
        
        <div id="share-block" class="share-box">
            <p style="font-size: 14px; margin: 5px 0;">Скопируйте эту ссылку и отправьте коллегам:</p>
            <input type="text" id="share-url" class="share-input" readonly onclick="this.select()">
        </div>
    </div>
</div>

<script>
    // 1. ЛОГИКА ТАЙМЕРА И СТАТУСА
    const urlParams = new URLSearchParams(window.location.search);
    const timeParam = urlParams.get('time');
    const isAdmin = urlParams.get('admin') === 'true';

    if (isAdmin) document.getElementById('admin-block').style.display = 'block';

    const titleEl = document.getElementById('status-title');
    const timerEl = document.getElementById('countdown');
    let timerIntervalId = null;

    document.getElementById('btn-generate').addEventListener('click', () => {
        const inputTime = document.getElementById('target-time').value;
        if (!inputTime) return alert("Пожалуйста, выберите дату и время!");
        const baseUrl = window.location.href.split('?');
        const generatedUrl = `${baseUrl}?time=${encodeURIComponent(inputTime)}`;
        document.getElementById('share-url').value = generatedUrl;
        document.getElementById('share-block').style.display = 'block';
    });

    function updateSeconds(targetDate) {
        const now = new Date();
        const diff = targetDate - now;
        if (diff <= 0) {
            titleEl.innerText = "VPN отключен";
            titleEl.className = "status-inactive";
            timerEl.innerText = "00:00:00";
            if (timerIntervalId) clearInterval(timerIntervalId);
            return;
        }
        titleEl.innerText = "До отключения VPN:";
        titleEl.className = "status-active";
        const hours = Math.floor(diff / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);
        const pad = (num) => String(num).padStart(2, '0');
        timerEl.innerText = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
    }

    if (timeParam) {
        const targetDate = new Date(timeParam);
        if (!isNaN(targetDate.getTime())) {
            updateSeconds(targetDate);
            timerIntervalId = setInterval(() => updateSeconds(targetDate), 1000);
        } else { showDisconnected(); }
    } else { showDisconnected(); }

    function showDisconnected() {
        titleEl.innerText = "VPN отключен";
        titleEl.className = "status-inactive";
        timerEl.innerText = "00:00:00";
    }

    // 2. ОТКАТ ОУСТОЙЧИВЫЙ ДВИЖОК КОТОВ
    const mainCard = document.getElementById('main-card');
    const rocks = document.querySelectorAll('.rock');
    const cats = [];
    const colors = ['#1f2937', '#f59e0b', '#6b7280', '#f8fafc']; // Черный, Рыжий, Серый, Белый
    const numCats = 4;

    for (let i = 0; i < numCats; i++) {
        const catEl = document.createElement('div');
        catEl.className = 'pixel-cat';
        catEl.style.backgroundColor = colors[i % colors.length];
        catEl.style.color = colors[i % colors.length]; // Для цвета ушек
        document.body.appendChild(catEl);

        cats.push({
            element: catEl,
            x: Math.random() * (window.innerWidth - 80) + 20,
            y: Math.random() * (window.innerHeight - 80) + 20,
            vx: (Math.random() > 0.5 ? 2 : -2),
            vy: (Math.random() > 0.5 ? 2 : -2),
            speedMultiplier: 1,
            width: 40,
            height: 30
        });
    }

    // Безопасный игровой цикл через setInterval (25 кадров в секунду)
    setInterval(() => {
        const cardRect = mainCard.getBoundingClientRect();

        cats.forEach(cat => {
            let nextX = cat.x + cat.vx * cat.speedMultiplier;
            let nextY = cat.y + cat.vy * cat.currentSpeedMultiplier; // Исправлено на cat.speedMultiplier
            nextY = cat.y + cat.vy * cat.speedMultiplier;

            // Стенки экрана
            if (nextX < 0 || nextX > window.innerWidth - cat.width) { cat.vx *= -1; nextX = cat.x; }
            if (nextY < 0 || nextY > window.innerHeight - cat.height) { cat.vy *= -1; nextY = cat.y; }

            // Столкновение с карточкой таймера
            if (nextX + cat.width > cardRect.left && nextX < cardRect.right && 
                nextY + cat.height > cardRect.top && nextY < cardRect.bottom) {
                if (cat.x + cat.width <= cardRect.left || cat.x >= cardRect.right) { cat.vx *= -1; } 
                else { cat.vy *= -1; }
                nextX = cat.x; nextY = cat.y;
            }

            // Столкновение с камнями
            rocks.forEach(rock => {
                const rockRect = rock.getBoundingClientRect();
                if (nextX + cat.width > rockRect.left && nextX < rockRect.right && 
                    nextY + cat.height > rockRect.top && nextY < rockRect.bottom) {
                    cat.vx *= -1; cat.vy *= -1;
                    nextX = cat.x; nextY = cat.y;
                }
            });

            cat.x = nextX;
            cat.y = nextY;

            cat.element.style.left = cat.x + 'px';
            cat.element.style.top = cat.y + 'px';
            cat.element.style.transform = cat.vx > 0 ? 'scaleX(1)' : 'scaleX(-1)';

            if (cat.speedMultiplier > 1) cat.speedMultiplier -= 0.05;
        });
    }, 40);

    // Страх перед мыжкой
    document.addEventListener('mousemove', (e) => {
        cats.forEach(cat => {
            const centerX = cat.x + cat.width / 2;
            const centerY = cat.y + cat.height / 2;
            const diffX = e.clientX - centerX;
            const diffY = e.clientY - centerY;
            const distance = Math.sqrt(diffX * diffX + diffY * diffY);

            if (distance < 120) {
                cat.speedMultiplier = 3.5;
                cat.vx = diffX > 0 ? -2 : 2;
                cat.vy = diffY > 0 ? -2 : 2;
            }
        });
    });
</script>

</body>
</html>
