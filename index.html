<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статус VPN</title>
    <style>
        /* Базовые стили */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f3f4f6;
            color: #1f2937;
            overflow-x: hidden;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
            margin: auto; /* Центрируем карточку по вертикали */
            z-index: 10;
        }
        h1 { font-size: 24px; margin-bottom: 20px; }
        .timer { font-size: 48px; font-weight: bold; margin: 20px 0; font-variant-numeric: tabular-nums; }
        .status-active { color: #dc2626; }
        .status-inactive { color: #10b981; }
        
        /* Панель администратора */
        .admin-panel {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #e5e7eb;
            display: none;
            background: #f9fafb;
            border-radius: 8px;
            padding: 15px;
        }
        .admin-panel input {
            padding: 8px;
            margin: 10px 0;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            width: 80%;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: background 0.2s;
        }
        .btn-start { background-color: #2563eb; color: white; }
        .btn-start:hover { background-color: #1d4ed8; }
        .share-box { margin-top: 15px; display: none; }
        .share-input {
            width: 90%;
            padding: 8px;
            font-size: 12px;
            background: #e5e7eb;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            text-align: center;
        }

        /* 👾 ПИКСЕЛЬНЫЙ ФУТЕР И АНИМАЦИЯ */
        .pixel-footer {
            width: 100%;
            height: 120px;
            position: relative;
            background-color: #2ed573; /* Цвет травы */
            border-top: 6px solid #26af5f; /* Земляной шов */
            image-rendering: pixelated; /* Делает пиксели четкими без размытия */
        }
        
        /* Текстура земли в стиле 8-бит */
        .pixel-footer::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(45deg, #26af5f 25%, transparent 25%), 
                linear-gradient(-45deg, #26af5f 25%, transparent 25%);
            background-size: 16px 16px;
            opacity: 0.15;
        }

        /* Кот из спрайта (анимация через CSS) */
        .pixel-cat {
            width: 48px;
            height: 32px;
            position: absolute;
            bottom: 40px;
            left: -50px;
            /* Встраиваем легкий пиксельный GIF черного кота без CORS ограничений */
            background-image: url('https://pixabay.com');
            background-size: contain;
            background-repeat: no-repeat;
            image-rendering: pixelated;
            
            /* Заставляем кота идти слева направо */
            animation: walkAcross 15s linear infinite;
        }

        /* Анимация движения через весь экран */
        @keyframes walkAcross {
            0% { left: -50px; transform: scaleX(1); }
            49% { left: calc(100% + 50px); transform: scaleX(1); }
            50% { left: calc(100% + 50px); transform: scaleX(-1); } /* Разворачиваем кота назад */
            99% { left: -50px; transform: scaleX(-1); }
            100% { left: -50px; transform: scaleX(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="status-title">Определение статуса...</h1>
    <div id="countdown" class="timer">00:00:00</div>

    <!-- АДМИН-ПАНЕЛЬ -->
    <div id="admin-block" class="admin-panel">
        <h3>Панель администратора</h3>
        <label>Укажите дату и время отключения:<br>
            <input type="datetime-local" id="target-time">
        </label><br>
        <button class="btn btn-start" id="btn-generate">Сгенерировать ссылку</button>
        
        <div id="share-block" class="share-box">
            <p style="font-size: 14px; margin: 5px 0;">Скопируйте эту ссылку и отправьте коллегам:</p>
            <input type="text" id="share-url" class="share-input" readonly onclick="this.select()">
        </div>
    </div>
</div>

<!-- Блок футера с анимацией -->
<div class="pixel-footer">
    <div class="pixel-cat"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const timeParam = urlParams.get('time');
    const isAdmin = urlParams.get('admin') === 'true';

    if (isAdmin) {
        document.getElementById('admin-block').style.display = 'block';
    }

    const titleEl = document.getElementById('status-title');
    const timerEl = document.getElementById('countdown');
    let intervalId = null;

    document.getElementById('btn-generate').addEventListener('click', () => {
        const inputTime = document.getElementById('target-time').value;
        if (!inputTime) {
            alert("Пожалуйста, выберите дату и время!");
            return;
        }
        const baseUrl = window.location.href.split('?');
        const generatedUrl = `${baseUrl[0]}?time=${encodeURIComponent(inputTime)}`;
        
        const shareInput = document.getElementById('share-url');
        shareInput.value = generatedUrl;
        document.getElementById('share-block').style.display = 'block';
        shareInput.select();
        alert("Ссылка успешно создана и выведена ниже!");
    });

    if (timeParam) {
        const targetDate = new Date(timeParam);
        if (!isNaN(targetDate.getTime())) {
            function updateSeconds() {
                const now = new Date();
                const diff = targetDate - now;

                if (diff <= 0) {
                    titleEl.innerText = "VPN отключен";
                    titleEl.className = "status-inactive";
                    timerEl.innerText = "00:00:00";
                    timerEl.className = "timer status-inactive";
                    clearInterval(intervalId);
                    return;
                }

                titleEl.innerText = "До отключения VPN:";
                titleEl.className = "status-active";
                timerEl.className = "timer status-active";

                const hours = Math.floor(diff / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                const pad = (num) => String(num).padStart(2, '0');
                timerEl.innerText = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
            }
            updateSeconds();
            intervalId = setInterval(updateSeconds, 1000);
        } else {
            showDisconnected();
        }
    } else {
        showDisconnected();
    }

    function showDisconnected() {
        titleEl.innerText = "VPN отключен";
        titleEl.className = "status-inactive";
        timerEl.innerText = "00:00:00";
        timerEl.className = "timer status-inactive";
    }
</script>

</body>
</html>
