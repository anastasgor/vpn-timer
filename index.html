<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статус VPN</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
        }
        h1 { font-size: 24px; margin-bottom: 20px; }
        .timer { font-size: 48px; font-weight: bold; margin: 20px 0; font-variant-numeric: tabular-nums; }
        
        /* Стили статусов */
        .status-active { color: #dc2626; } /* Красный при обратном отсчете */
        .status-inactive { color: #10b981; } /* Зеленый, когда отключен */

        /* Панель администратора */
        .admin-panel {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #e5e7eb;
            display: none; /* Скрыта по умолчанию */
        }
        .admin-panel input {
            padding: 8px;
            margin: 5px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: background 0.2s;
        }
        .btn-start { background-color: #2563eb; color: white; }
        .btn-start:hover { background-color: #1d4ed8; }
        .btn-stop { background-color: #4b5563; color: white; }
        .btn-stop:hover { background-color: #374151; }
    </style>

    <!-- Подключаем Firebase SDK -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body>

<div class="container">
    <h1 id="status-title">Загрузка...</h1>
    <div id="countdown" class="timer">--:--:--</div>

    <!-- АДМИН-ПАНЕЛЬ (видима только по секретной ссылке) -->
    <div id="admin-block" class="admin-panel">
        <h3>Панель администратора</h3>
        <label>До какого времени считать:<br>
            <input type="datetime-local" id="target-time">
        </label><br>
        <button class="btn btn-start" onclick="startTimer()">Запустить отсчет</button>
        <button class="btn btn-stop" onclick="stopTimer()">Сбросить / Отключить</button>
    </div>
</div>

<script>
    // 1. НАСТРОЙКА FIREBASE (Вставьте сюда свои данные из консоли Firebase)
   const firebaseConfig = {
  apiKey: "AIzaSyBmkogbCgQdE2vPyE3YYW-lfKgpr0gBRB4",
  authDomain: "vpn1-26e6a.firebaseapp.com",
  databaseURL: "https://vpn1-26e6a-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "vpn1-26e6a",
  storageBucket: "vpn1-26e6a.firebasestorage.app",
  messagingSenderId: "1018718639011",
  appId: "1:1018718639011:web:d2e36fae23fdcc88110016"
};

    // Инициализация
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Переменные для хранения состояния из БД
    let timerState = { active: false, targetDate: "" };
    let intervalId = null;

    // 2. ПРОВЕРКА НА АДМИНА
    // Если в адресе страницы есть ?admin=true, показываем панель управления
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('admin') === 'true') {
        document.getElementById('admin-block').style.display = 'block';
    }

    // 3. СИНХРОНИЗАЦИЯ С БАЗОЙ ДАННЫХ (Запускается у всех пользователей автоматически)
    db.ref('vpn_timer').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            timerState = data;
            renderUI();
        } else {
            // Если в базе еще нет данных
            timerState = { active: false, targetDate: "" };
            renderUI();
        }
    });

    // 4. ФУНКЦИИ АДМИНИСТРАТОРА (Запись в БД)
    function startTimer() {
        const inputTime = document.getElementById('target-time').value;
        if (!inputTime) {
            alert("Пожалуйста, выберите дату и время окончания!");
            return;
        }
        
        // Сохраняем состояние "Активен" и ISO-строку времени в Firebase
        db.ref('vpn_timer').set({
            active: true,
            targetDate: new Date(inputTime).toISOString()
        });
    }

    function stopTimer() {
        // Сбрасываем триггер активности в Firebase
        db.ref('vpn_timer').set({
            active: false,
            targetDate: ""
        });
    }

    // 5. ОТОБРАЖЕНИЕ ДЛЯ ПОЛЬЗОВАТЕЛЕЙ
    function renderUI() {
        // Очищаем предыдущий работающий интервал пересчета секунд
        if (intervalId) clearInterval(intervalId);

        const titleEl = document.getElementById('status-title');
        const timerEl = document.getElementById('countdown');

        if (timerState.active && timerState.targetDate) {
            titleEl.innerText = "До отключения VPN:";
            titleEl.className = "status-active";
            timerEl.className = "timer status-active";

            // Функция обновления каждую секунду
            function updateSeconds() {
                const now = new Date();
                const target = new Date(timerState.targetDate);
                const diff = target - now;

                if (diff <= 0) {
                    titleEl.innerText = "VPN отключен";
                    titleEl.className = "status-inactive";
                    timerEl.innerText = "00:00:00";
                    timerEl.className = "timer status-inactive";
                    clearInterval(intervalId);
                    return;
                }

                // Расчет времени
                const hours = Math.floor(diff / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                // Добавление нулей для красоты (01:05:09)
                const pad = (num) => String(num).padStart(2, '0');
                timerEl.innerText = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
            }

            updateSeconds();
            intervalId = setInterval(updateSeconds, 1000);

        } else {
            // Если кнопка не нажата админом
            titleEl.innerText = "VPN отключен";
            titleEl.className = "status-inactive";
            timerEl.innerText = "00:00:00";
            timerEl.className = "timer status-inactive";
        }
    }
</script>

</body>
</html>
