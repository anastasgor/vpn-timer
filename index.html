<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статус VPN</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
        }
        h1 { font-size: 24px; margin-bottom: 20px; }
        .timer { font-size: 48px; font-weight: bold; margin: 20px 0; font-variant-numeric: tabular-nums; }
        .status-active { color: #dc2626; }
        .status-inactive { color: #10b981; }
        
        .admin-panel {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #e5e7eb;
            display: none;
        }
        .admin-panel input {
            padding: 8px;
            margin: 5px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: background 0.2s;
        }
        .btn-start { background-color: #2563eb; color: white; }
        .btn-start:hover { background-color: #1d4ed8; }
        .btn-stop { background-color: #4b5563; color: white; }
        .btn-stop:hover { background-color: #374151; }
        .error-msg { color: #b91c1c; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="status-title">Загрузка...</h1>
    <div id="countdown" class="timer">--:--:--</div>
    <div id="error-log" class="error-msg"></div>

    <!-- АДМИН-ПАНЕЛЬ -->
    <div id="admin-block" class="admin-panel">
        <h3>Панель администратора</h3>
        <label>До какого времени считать:<br>
            <input type="datetime-local" id="target-time">
        </label><br>
        <button class="btn btn-start" id="btn-start">Запустить отсчет</button>
        <button class="btn btn-stop" id="btn-stop">Сбросить / Отключить</button>
    </div>
</div>

<!-- Подключаем современный Firebase модульно -->
<script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getDatabase, ref, set, onValue } from "https://gstatic.com";

    // 1. НАСТРОЙКА FIREBASE ( databaseURL больше не нужен! )
    const firebaseConfig = {
        apiKey: "AIzaSyBmkogbCgQdE2vPyE3YYW-lfKgpr0gBRB4",
        projectId: "vpn1-26e6a"
    };

    let db;
    try {
        const app = initializeApp(firebaseConfig);
        db = getDatabase(app);
    } catch (e) {
        document.getElementById('status-title').innerText = "Ошибка запуска";
        document.getElementById('error-log').innerText = "Не удалось инициализировать Firebase: " + e.message;
    }

    let timerState = { active: false, targetDate: "" };
    let intervalId = null;

    // 2. ПРОВЕРКА НА АДМИНА
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('admin') === 'true') {
        document.getElementById('admin-block').style.display = 'block';
    }

    // 3. СИНХРОНИЗАЦИЯ С БАЗОЙ ДАННЫХ
    if (db) {
        onValue(ref(db, 'vpn_timer'), (snapshot) => {
            const data = snapshot.val();
            timerState = data ? data : { active: false, targetDate: "" };
            renderUI();
        }, (error) => {
            document.getElementById('status-title').innerText = "Ошибка БД";
            document.getElementById('error-log').innerText = "Firebase заблокировал чтение: " + error.message + ". Проверьте вкладку Rules в Firebase!";
        });
    }

    // 4. ФУНКЦИИ АДМИНИСТРАТОРА
    document.getElementById('btn-start').addEventListener('click', () => {
        const inputTime = document.getElementById('target-time').value;
        if (!inputTime) {
            alert("Пожалуйста, выберите дату и время окончания!");
            return;
        }
        set(ref(db, 'vpn_timer'), {
            active: true,
            targetDate: new Date(inputTime).toISOString()
        }).catch(err => {
            alert("Ошибка записи! Проверьте правила (Rules) в Firebase. Текст: " + err.message);
        });
    });

    document.getElementById('btn-stop').addEventListener('click', () => {
        set(ref(db, 'vpn_timer'), {
            active: false,
            targetDate: ""
        });
    });

    // 5. ОТОБРАЖЕНИЕ ДЛЯ ПОЛЬЗОВАТЕЛЕЙ
    function renderUI() {
        if (intervalId) clearInterval(intervalId);

        const titleEl = document.getElementById('status-title');
        const timerEl = document.getElementById('countdown');

        if (timerState.active && timerState.targetDate) {
            titleEl.innerText = "До отключения VPN:";
            titleEl.className = "status-active";
            timerEl.className = "timer status-active";

            function updateSeconds() {
                const now = new Date();
                const target = new Date(timerState.targetDate);
                const diff = target - now;

                if (diff <= 0) {
                    titleEl.innerText = "VPN отключен";
                    titleEl.className = "status-inactive";
                    timerEl.innerText = "00:00:00";
                    timerEl.className = "timer status-inactive";
                    clearInterval(intervalId);
                    return;
                }

                const hours = Math.floor(diff / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                const pad = (num) => String(num).padStart(2, '0');
                timerEl.innerText = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
            }

            updateSeconds();
            intervalId = setInterval(updateSeconds, 1000);

        } else {
            titleEl.innerText = "VPN отключен";
            titleEl.className = "status-inactive";
            timerEl.innerText = "00:00:00";
            timerEl.className = "timer status-inactive";
        }
    }
</script>

</body>
</html>
