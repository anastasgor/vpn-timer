<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статус VPN</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #2ed573; /* Фон — зеленая лужайка */
            overflow: hidden;
            position: relative;
        }

        /* Текстура травы на весь экран */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(45deg, #26af5f 25%, transparent 25%), 
                linear-gradient(-45deg, #26af5f 25%, transparent 25%);
            background-size: 32px 32px;
            opacity: 0.2;
            z-index: 1;
        }

        /* Препятствие №1: Центральная карточка таймера */
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 10; /* Поверх фона */
            border: 4px solid #1f2937;
        }

        h1 { font-size: 24px; margin-bottom: 20px; }
        .timer { font-size: 48px; font-weight: bold; margin: 20px 0; font-variant-numeric: tabular-nums; }
        .status-active { color: #dc2626; }
        .status-inactive { color: #10b981; }
        
        .admin-panel {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #e5e7eb;
            display: none;
            background: #f9fafb;
            border-radius: 8px;
            padding: 15px;
        }
        .admin-panel input {
            padding: 8px;
            margin: 10px 0;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            width: 80%;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: background 0.2s;
        }
        .btn-start { background-color: #2563eb; color: white; }
        .share-box { margin-top: 15px; display: none; }
        .share-input { width: 90%; padding: 8px; font-size: 12px; text-align: center; }

        /* Препятствия №2: Камни на лужайке */
        .rock {
            position: absolute;
            width: 40px;
            height: 32px;
            background: transparent;
            box-shadow: 
                8px 0px #4b5563, 12px 0px #4b5563, 16px 0px #4b5563,
                4px 4px #4b5563, 8px 4px #9ca3af, 12px 4px #9ca3af, 16px 4px #9ca3af, 20px 4px #4b5563,
                0px 8px #4b5563, 4px 8px #9ca3af, 8px 8px #9ca3af, 12px 8px #9ca3af, 16px 8px #d1d5db, 20px 8px #9ca3af, 24px 8px #4b5563,
                0px 12px #4b5563, 4px 12px #4b5563, 8px 12px #4b5563, 12px 12px #4b5563, 16px 12px #4b5563, 20px 12px #4b5563, 24px 12px #4b5563;
            z-index: 2;
        }

        /* БАЗОВЫЙ КЛАСС ДЛЯ КОТОВ */
        .pixel-cat {
            width: 4px;
            height: 4px;
            position: absolute;
            pointer-events: none;
            z-index: 5;
            background: transparent;
            will-change: transform, left, top;
        }
    </style>
</head>

<!-- Препятствия-камни в случайных местах -->
<div class="rock" style="top: 15%; left: 20%;"></div>
<div class="rock" style="top: 25%; right: 15%;"></div>
<div class="rock" style="bottom: 20%; left: 15%;"></div>
<div class="rock" style="bottom: 15%; right: 25%;"></div>

    <h1 id="status-title">Определение статуса...</h1>
    <div id="countdown" class="timer">00:00:00</div>

    <!-- АДМИН-ПАНЕЛЬ -->
    <div id="admin-block" class="admin-panel">
        <h3>Панель администратора</h3>
        <label>Укажите дату и время отключения:<br>
            <input type="datetime-local" id="target-time">
        </label><br>
        <button class="btn btn-start" id="btn-generate">Сгенерировать ссылку</button>
        
        <div id="share-block" class="share-box">
            <p style="font-size: 14px; margin: 5px 0;">Скопируйте эту ссылку и отправьте коллегам:</p>
            <input type="text" id="share-url" class="share-input" readonly onclick="this.select()">
        </div>
    </div>

    // 1. ЛОГИКА ТАЙМЕРА (БЕЗ ИЗМЕНЕНИЙ)
    const urlParams = new URLSearchParams(window.location.search);
    const timeParam = urlParams.get('time');
    const isAdmin = urlParams.get('admin') === 'true';

    if (isAdmin) document.getElementById('admin-block').style.display = 'block';

    const titleEl = document.getElementById('status-title');
    const timerEl = document.getElementById('countdown');
    let intervalId = null;

    document.getElementById('btn-generate').addEventListener('click', () => {
        const inputTime = document.getElementById('target-time').value;
        if (!inputTime) return alert("Пожалуйста, выберите дату и время!");
        const baseUrl = window.location.href.split('?');
        const generatedUrl = `${baseUrl}?time=${encodeURIComponent(inputTime)}`;
        document.getElementById('share-url').value = generatedUrl;
        document.getElementById('share-block').style.display = 'block';
    });

    if (timeParam) {
        const targetDate = new Date(timeParam);
        if (!isNaN(targetDate.getTime())) {
            function updateSeconds() {
                const now = new Date();

                    titleEl.innerText = "VPN отключен";

                    return clearInterval(intervalId);

            }

        } else { showDisconnected(); }
    } else { showDisconnected(); }

        titleEl.innerText = "VPN отключен";
        titleEl.className = "status-inactive";

    }
