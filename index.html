<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статус VPN</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
        }
        h1 { font-size: 24px; margin-bottom: 20px; }
        .timer { font-size: 48px; font-weight: bold; margin: 20px 0; font-variant-numeric: tabular-nums; }
        .status-active { color: #dc2626; }
        .status-inactive { color: #10b981; }
        
        .admin-panel {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px dashed #e5e7eb;
            display: none;
            background: #f9fafb;
            border-radius: 8px;
            padding: 15px;
        }
        .admin-panel input {
            padding: 8px;
            margin: 10px 0;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            width: 80%;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: background 0.2s;
        }
        .btn-start { background-color: #2563eb; color: white; }
        .btn-start:hover { background-color: #1d4ed8; }
        .share-box {
            margin-top: 15px;
            display: none;
        }
        .share-input {
            width: 90%;
            padding: 8px;
            font-size: 12px;
            background: #e5e7eb;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="status-title">Определение статуса...</h1>
    <div id="countdown" class="timer">00:00:00</div>

    <!-- АДМИН-ПАНЕЛЬ -->
    <div id="admin-block" class="admin-panel">
        <h3>Панель администратора</h3>
        <label>Укажите дату и время отключения:<br>
            <input type="datetime-local" id="target-time">
        </label><br>
        <button class="btn btn-start" id="btn-generate">Сгенерировать ссылку</button>
        
        <div id="share-block" class="share-box">
            <p style="font-size: 14px; margin: 5px 0;">Скопируйте эту ссылку и отправьте коллегам:</p>
            <input type="text" id="share-url" class="share-input" readonly onclick="this.select()">
        </div>
    </div>
</div>

<script>
    // Получаем параметры из адресной строки страницы
    const urlParams = new URLSearchParams(window.location.search);
    const timeParam = urlParams.get('time');
    const isAdmin = urlParams.get('admin') === 'true';

    // Показываем админку, если в ссылке есть ?admin=true
    if (isAdmin) {
        document.getElementById('admin-block').style.display = 'block';
    }

    const titleEl = document.getElementById('status-title');
    const timerEl = document.getElementById('countdown');
    let intervalId = null;

    // Функция генерации ссылки для администратора
    document.getElementById('btn-generate').addEventListener('click', () => {
        const inputTime = document.getElementById('target-time').value;
        if (!inputTime) {
            alert("Пожалуйста, выберите дату и время!");
            return;
        }
        // Формируем чистый URL без текущих параметров и добавляем время
        const baseUrl = window.location.href.split('?')[0];
        const generatedUrl = `${baseUrl}?time=${encodeURIComponent(inputTime)}`;
        
        const shareInput = document.getElementById('share-url');
        shareInput.value = generatedUrl;
        document.getElementById('share-block').style.display = 'block';
        
        // Автоматически выделяем текст ссылки для удобства копирования
        shareInput.select();
        alert("Ссылка успешно создана и выведена ниже! Скопируйте её.");
    });

    // Логика работы таймера для пользователей
    if (timeParam) {
        const targetDate = new Date(timeParam);

        // Проверяем, корректная ли дата передана в ссылке
        if (!isNaN(targetDate.getTime())) {
            
            function updateSeconds() {
                const now = new Date();
                const diff = targetDate - now;

                // Если время вышло
                if (diff <= 0) {
                    titleEl.innerText = "VPN отключен";
                    titleEl.className = "status-inactive";
                    timerEl.innerText = "00:00:00";
                    timerEl.className = "timer status-inactive";
                    clearInterval(intervalId);
                    return;
                }

                titleEl.innerText = "До отключения VPN:";
                titleEl.className = "status-active";
                timerEl.className = "timer status-active";

                // Расчет времени
                const hours = Math.floor(diff / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                const pad = (num) => String(num).padStart(2, '0');
                timerEl.innerText = `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
            }

            updateSeconds();
            intervalId = setInterval(updateSeconds, 1000);
        } else {
            // Если в параметре `time` передан сломанный формат текста
            showDisconnected();
        }
    } else {
        // Если ссылка обычная (параметра `time` вообще нет)
        showDisconnected();
    }

    function showDisconnected() {
        titleEl.innerText = "VPN отключен";
        titleEl.className = "status-inactive";
        timerEl.innerText = "00:00:00";
        timerEl.className = "timer status-inactive";
    }
</script>

</body>
</html>
